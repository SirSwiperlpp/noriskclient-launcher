name: Fork Build (macOS & Linux)

# Fork-friendly installer build for macOS and Linux. Unlike the upstream
# "Build and Release" workflow, this one has no Azure code-signing, no
# `environment: signing` and no norisk.gg backend calls, so it runs on a fork.
#
# Requirements on the fork:
#   - Add a repository secret TAURI_SIGNING_PRIVATE_KEY with the contents of your
#     Tauri updater private key (the project has `createUpdaterArtifacts: true`,
#     so the build needs it). If your key has a password, also add
#     TAURI_SIGNING_PRIVATE_KEY_PASSWORD; otherwise leave it unset.
#
# Run it manually from the Actions tab ("Run workflow"). The installers are
# uploaded as build artifacts on the run (.dmg for macOS, .AppImage/.deb for
# Linux). The AppImage runs on any Linux distro, including CachyOS.

on:
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64
          - platform: macos-latest
            target: x86_64-apple-darwin
            name: macos-x86_64
          - platform: ubuntu-22.04
            target: ''
            name: linux

    runs-on: ${{ matrix.platform }}
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: yarn

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile

      # On macOS the launcher links the norisk-capture engine (ffmpeg); build and
      # stage it first. ffmpeg comes preinstalled on the macOS runners.
      - name: Stage the macOS capture engine
        if: matrix.platform == 'macos-latest'
        run: node scripts/stage-native-deps.mjs --target ${{ matrix.target }}

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RUSTFLAGS: ${{ matrix.platform == 'ubuntu-22.04' && '-C link-arg=-Wl,--no-as-needed -C link-arg=-layatana-appindicator3 -C link-arg=-Wl,--as-needed' || '' }}
        with:
          args: ${{ matrix.target != '' && format('--target {0}', matrix.target) || '' }}
          packageManager: yarn

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.name }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: warn
