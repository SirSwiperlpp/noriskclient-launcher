name: Fork Build (macOS, Linux & Windows)

# Fork-friendly installer build for macOS, Linux and Windows. Unlike the
# upstream "Build and Release" workflow, this one has no Azure code-signing, no
# `environment: signing` and no norisk.gg backend calls, so it runs on a fork.
# It also disables the Tauri updater signature for the build, so no signing
# secret is required.
#
# Run it manually from the Actions tab ("Run workflow"). The installers are
# uploaded as build artifacts on the run: .dmg (macOS), .AppImage/.deb (Linux)
# and the NSIS setup .exe (Windows). The AppImage runs on any Linux distro,
# including CachyOS.

on:
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64
          - platform: macos-latest
            target: x86_64-apple-darwin
            name: macos-x86_64
          - platform: ubuntu-22.04
            target: ''
            name: linux
          - platform: windows-latest
            target: ''
            name: windows

    runs-on: ${{ matrix.platform }}
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: yarn

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile

      # On macOS the launcher links the norisk-capture engine (ffmpeg); build and
      # stage it first. ffmpeg comes preinstalled on the macOS runners.
      - name: Stage the macOS capture engine
        if: matrix.platform == 'macos-latest'
        run: node scripts/stage-native-deps.mjs --target ${{ matrix.target }}

      # Personal installers don't need the Tauri updater signature, so disable it
      # for the CI build. This removes the need for a TAURI_SIGNING_PRIVATE_KEY
      # secret (the project sets createUpdaterArtifacts: true, which otherwise
      # fails the build when no key is present).
      - name: Disable updater artifacts for the CI build
        shell: bash
        run: |
          node -e "const f='src-tauri/tauri.conf.json';const fs=require('fs');const c=JSON.parse(fs.readFileSync(f,'utf8'));c.bundle=c.bundle||{};c.bundle.createUpdaterArtifacts=false;fs.writeFileSync(f,JSON.stringify(c,null,2));console.log('createUpdaterArtifacts disabled for CI');"

      # Windows: building norisk-capture (ffmpeg-sys-next -> bindgen) needs
      # libclang. The windows-latest runner ships LLVM at C:\Program Files\LLVM.
      - name: Point to libclang (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $llvm = "C:\Program Files\LLVM\bin"
          if (Test-Path "$llvm\libclang.dll") {
            "LIBCLANG_PATH=$llvm" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            Write-Host "Using libclang at $llvm"
          } else {
            Write-Host "libclang not found at $llvm; relying on PATH"
          }

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          RUSTFLAGS: ${{ matrix.platform == 'ubuntu-22.04' && '-C link-arg=-Wl,--no-as-needed -C link-arg=-layatana-appindicator3 -C link-arg=-Wl,--as-needed' || '' }}
        with:
          args: ${{ matrix.target != '' && format('--target {0}', matrix.target) || '' }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.name }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
